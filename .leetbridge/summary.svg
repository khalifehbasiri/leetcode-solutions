<text x="728" y="190" class="label" text-anchor="end">12 files</text>
<rect x="32" y="208" width="696" height="10" rx="5" fill="#262438"/>
<g clip-path="url(#language-bar)"><rect x="32" y="208" width="696" height="10" fill="#4b8bbe"/></g>
<circle cx="38" cy="243" r="6" fill="#4b8bbe"/><text x="52" y="248" class="legend">Python</text><text x="244" y="248" class="legend-count" text-anchor="end">12</text>
