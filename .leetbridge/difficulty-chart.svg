<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
<title id="title">Difficulty breakdown for 12 problems: 7 easy, 4 medium, 1 hard</title>
<desc id="desc">A pie chart showing solved LeetCode problems by difficulty.</desc>
<defs><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ff2e88"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><style>
.heading{font:600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#ff4b91}
.eyebrow{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:1.2px;fill:#8b949e}
.total{font:700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f6fc}
.label{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dbe4ee}
.count{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f6fc}
.percent{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8b949e}
</style></defs>
<rect x="1" y="1" width="758" height="258" rx="12" fill="#141321" stroke="#30363d"/>
<rect x="1" y="1" width="758" height="4" rx="2" fill="url(#accent)"/>
<text x="32" y="45" class="heading">Difficulty Breakdown</text>
<text x="32" y="72" class="eyebrow">SOLVED PROBLEMS</text>
<path d="M 150 152 L 150.00 64.00 A 88 88 0 1 1 106.00 228.21 Z" fill="#00b8a3"/><path d="M 150 152 L 106.00 228.21 A 88 88 0 0 1 106.00 75.79 Z" fill="#ffc01e"/><path d="M 150 152 L 106.00 75.79 A 88 88 0 0 1 150.00 64.00 Z" fill="#ef4743"/>
<circle cx="150" cy="152" r="47" fill="#141321"/>
<text x="150" y="148" class="total" text-anchor="middle">12</text>
<text x="150" y="169" class="eyebrow" text-anchor="middle">SOLVED</text>
<text x="310" y="66" class="eyebrow">DIFFICULTY</text>
<text x="620" y="66" class="eyebrow" text-anchor="end">COUNT</text>
<text x="704" y="66" class="eyebrow" text-anchor="end">SHARE</text>
<circle cx="310" cy="91" r="7" fill="#00b8a3"/><text x="328" y="96" class="label">Easy</text><text x="620" y="96" class="count" text-anchor="end">7</text><text x="704" y="96" class="percent" text-anchor="end">58%</text><circle cx="310" cy="133" r="7" fill="#ffc01e"/><text x="328" y="138" class="label">Medium</text><text x="620" y="138" class="count" text-anchor="end">4</text><text x="704" y="138" class="percent" text-anchor="end">33%</text><circle cx="310" cy="175" r="7" fill="#ef4743"/><text x="328" y="180" class="label">Hard</text><text x="620" y="180" class="count" text-anchor="end">1</text><text x="704" y="180" class="percent" text-anchor="end">8%</text>
</svg>
